<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ site.name }}{% if page.title %}: {{ page.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.name }}{% if page.title %}: {{ page.title }}{% endif %}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/valentina_web.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="{{ site.twitter }}">

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link rel="icon" href="{{ site.url }}/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.url }}/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Valentina Pyatkin",
      "url": "{{ site.url }}",
      "image": "{{ site.url }}/valentina_web.jpg",
      "jobTitle": "Researcher",
      "worksFor": [
        { "@type": "Organization", "name": "ETH AI Center" }
      ],
      "sameAs": [
        "https://scholar.google.com/citations?user=E9EgKkMAAAAJ",
        "https://www.linkedin.com/in/valentina-pyatkin/",
        "https://x.com/valentina__py"
      ]
    }
    </script>

    {% if site.google_analytics %}
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}

    {% if site.goatcounter %}
    <!-- GoatCounter (privacy-friendly analytics) -->
    <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
    {% endif %}

    {% if page.mathjax %}
    <script type="text/javascript" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    {% endif %}
</head>

<body>
    <nav class="site-nav" aria-label="Primary">
        <a class="site-nav__brand" href="{{ site.url }}/">{{ site.name }}</a>
        <ul class="site-nav__links">
            {% for item in site.navigation %}
            <li><a class="site-nav__link" href="{{ item.link }}">{{ item.title }}</a></li>
            {% endfor %}
        </ul>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </nav>

    <main class="page">
        {{ content }}
    </main>

    <footer class="site-footer">
        <ul class="social">
            <li><a href="mailto:valpyatkin@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a></li>
            <li><a href="https://scholar.google.com/citations?user=E9EgKkMAAAAJ&hl=en" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a></li>
            <li><a href="https://www.linkedin.com/in/valentina-pyatkin/" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>
            <li><a href="https://x.com/valentina__py" aria-label="X / Twitter"><i class="fa-brands fa-x-twitter"></i></a></li>
        </ul>
        <p>&copy; {{ site.time | date: "%Y" }} Valentina Pyatkin</p>
    </footer>

    <script>
      (function () {
        var themeBtn = document.querySelector('[data-theme-toggle]');
        if (themeBtn) {
          themeBtn.addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme');
            var isDark = current === 'dark' ||
              (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
          });
        }

        var newsToggle = document.querySelector('[data-news-toggle]');
        if (newsToggle) {
          newsToggle.addEventListener('click', function () {
            var news = newsToggle.closest('.news');
            var expanded = news.classList.toggle('is-expanded');
            newsToggle.querySelector('span').textContent =
              expanded ? 'show fewer' : 'show all news';
            newsToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
          });
        }
      })();
    </script>
</body>
</html>
